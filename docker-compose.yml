services:
  app:
    build: ./docker/php
    container_name: stbc_app
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  queue-worker:
    build: ./docker/php
    container_name: stbc_queue_worker
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: >
      sh -c "php artisan queue:work ${QUEUE_CONNECTION:-redis}
      --sleep=${QUEUE_WORKER_SLEEP:-1}
      --tries=${QUEUE_WORKER_TRIES:-3}
      --memory=${QUEUE_WORKER_MEMORY:-256}
      --max-jobs=${QUEUE_WORKER_MAX_JOBS:-1000}
      --max-time=${QUEUE_WORKER_MAX_TIME:-3600}"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: stbc_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: stbc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stbc}
      POSTGRES_USER: ${POSTGRES_USER:-stbc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stbc_user} -d ${POSTGRES_DB:-stbc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: stbc_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: node:20
    container_name: stbc_frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://nginx}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - nginx

  minio:
    image: minio/minio
    container_name: stbc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
