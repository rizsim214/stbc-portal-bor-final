services:
  app:
    build: ./docker/php
    container_name: stbc_app
    volumes:
      - ./backend:/var/www
    depends_on:
      - postgres
      - minio

  nginx:
    image: nginx:latest
    container_name: stbc_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: stbc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stbc}
      POSTGRES_USER: ${POSTGRES_USER:-stbc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: node:20
    container_name: stbc_frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://nginx}
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - nginx

  minio:
    image: minio/minio
    container_name: stbc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
