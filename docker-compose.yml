services:
  app:
    build: ./backend/
    container_name: stbc_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - default
      - stbc-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build: ./backend/
    container_name: stbc_reverb
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - default
      - stbc-network
    command: >
      sh -c "php artisan reverb:start
      --host=${REVERB_SERVER_HOST:-0.0.0.0}
      --port=${REVERB_SERVER_PORT:-8080}"
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-worker:
    build: ./backend/
    container_name: stbc_queue_worker
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - default
      - stbc-network
    command: >
      sh -c "php artisan queue:work ${QUEUE_CONNECTION:-redis}
      --sleep=${QUEUE_WORKER_SLEEP:-1}
      --tries=${QUEUE_WORKER_TRIES:-3}
      --memory=${QUEUE_WORKER_MEMORY:-256}
      --max-jobs=${QUEUE_WORKER_MAX_JOBS:-1000}
      --max-time=${QUEUE_WORKER_MAX_TIME:-3600}"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: stbc_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: stbc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stbc}
      POSTGRES_USER: ${POSTGRES_USER:-stbc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stbc_user} -d ${POSTGRES_DB:-stbc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stbc-network

  redis:
    image: redis:7-alpine
    container_name: stbc_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: node:20
    container_name: stbc_frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://nginx}
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-stbc-reverb-key}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - nginx

volumes:
  postgres_data:

networks:
  stbc-network:
    driver: bridge
